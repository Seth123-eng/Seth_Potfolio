<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Authorized · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    /* ===== DASHBOARD UNIFIED CSS VARIABLES ===== */
    :root {
      --primary: #65A30D;
      --primary-dark: #4D7C0F;
      --primary-light: #84CC16;
      --primary-gradient: linear-gradient(135deg, #84CC16, #65A30D);
      --primary-bg: rgba(101, 163, 13, 0.08);

      --danger: #DC2626;
      --danger-bg: rgba(220, 38, 38, 0.08);
      
      --bg-main: #F8FAFC;
      --bg-surface: #FFFFFF;
      
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border-color: #E2E8F0;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ===== CARD CONTAINER ===== */
    .not-authorized-card {
      max-width: 520px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem 2rem;
      text-align: center;
      animation: modalSlideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transition: var(--transition);
    }

    .not-authorized-card:hover {
      box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.1);
    }

    /* ===== ICON ===== */
    .status-icon-wrapper {
      width: 64px;
      height: 64px;
      background: var(--danger-bg);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--danger);
      margin-bottom: 1.5rem;
    }

    .status-icon-wrapper .material-icons-round {
      font-size: 2.2rem;
    }

    /* ===== TYPOGRAPHY ===== */
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .sub-title {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-secondary);
      max-width: 360px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
    }

    /* ===== MESSAGE BOX ===== */
    .message-body {
      font-size: 0.9rem;
      color: #991B1B;
      line-height: 1.6;
      background: #FEF2F2;
      padding: 1rem 1.2rem;
      border-radius: var(--radius-md);
      border-left: 4px solid var(--danger);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-align: left;
    }

    .message-body .material-icons-round {
      font-size: 1.2rem;
      color: var(--danger);
      flex-shrink: 0;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes modalSlideUp {
      from { 
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to { 
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .not-authorized-card {
        padding: 1.8rem 1.2rem;
        border-radius: var(--radius-lg);
      }

      .title {
        font-size: 1.3rem;
      }

      .sub-title {
        font-size: 0.88rem;
      }

      .status-icon-wrapper {
        width: 52px;
        height: 52px;
      }

      .status-icon-wrapper .material-icons-round {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="not-authorized-card">
    <div class="status-icon-wrapper">
      <span class="material-icons-round">lock</span>
    </div>

    <h1 class="title">Access Restricted</h1>
    <p class="sub-title">You do not have the required permissions to access this feature.</p>

    <div class="message-body">
      <span class="material-icons-round">info</span>
      <span>This area is restricted. Please contact the site administrator if you believe this is an error.</span>
    </div>
  </div>

</body>
</html>
