<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Set · Portfolio</title>
  <!-- Google Font & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <style>
    /* ===== CSS VARIABLES ALIGNED WITH DASHBOARD THEME ===== */
    :root {
      --primary: #65A30D; /* Vibrant Lime/Green Accent */
      --primary-dark: #4D7C0F;
      --primary-light: #84CC16;
      --primary-gradient: linear-gradient(135deg, #84CC16, #65A30D);
      --primary-bg: rgba(101, 163, 13, 0.08);
      
      --bg-main: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-card: #FFFFFF;
      
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border-color: #E2E8F0;
      --border-light: #F1F5F9;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.03);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .skill-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      padding: 2rem;
      transition: var(--transition);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .skill-container:hover {
      box-shadow: var(--shadow-md);
    }

    /* Header */
    .skill-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.25rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand .brand-icon-wrapper {
      width: 42px;
      height: 42px;
      background: var(--primary-bg);
      border: 1px solid rgba(101, 163, 13, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-add-skill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background: var(--primary-gradient);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(101, 163, 13, 0.25);
      font-family: var(--font);
    }

    .btn-add-skill:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(101, 163, 13, 0.35);
    }

    .btn-add-skill .material-icons-round {
      font-size: 1.1rem;
    }

    .btn-add-skill.hidden {
      display: none !important;
    }

    /* Skill Content Grid */
    .skill-content {
      flex: 1;
    }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5rem;
      margin: 1rem 0;
    }

    .skill-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      animation: fadeUp 0.4s ease both;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .skill-card:nth-child(1) { animation-delay: 0.02s; }
    .skill-card:nth-child(2) { animation-delay: 0.06s; }
    .skill-card:nth-child(3) { animation-delay: 0.10s; }
    .skill-card:nth-child(4) { animation-delay: 0.14s; }
    .skill-card:nth-child(5) { animation-delay: 0.18s; }
    .skill-card:nth-child(6) { animation-delay: 0.22s; }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .skill-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: rgba(101, 163, 13, 0.4);
    }

    .skill-card .skill-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-card .skill-title .material-icons-round {
      font-size: 1.3rem;
      color: var(--primary);
    }

    .skill-card .skill-description {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1.25rem;
      word-wrap: break-word;
      flex: 1;
    }

    .skill-card .skill-actions {
      display: flex;
      gap: 0.5rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border-light);
      flex-wrap: wrap;
    }

    .skill-card .skill-actions.hidden {
      display: none !important;
    }

    .skill-card .btn-skill-action {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
    }

    .btn-skill-action .material-icons-round {
      font-size: 0.95rem;
    }

    .btn-edit-skill {
      background: var(--primary-bg);
      color: var(--primary-dark);
      border-color: rgba(101, 163, 13, 0.15);
    }

    .btn-edit-skill:hover {
      background: rgba(101, 163, 13, 0.15);
      color: var(--primary-dark);
    }

    .btn-delete-skill {
      background: #FEF2F2;
      color: #DC2626;
      border-color: rgba(220, 38, 38, 0.15);
    }

    .btn-delete-skill:hover {
      background: #FEE2E2;
      color: #991B1B;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state .material-icons-round {
      font-size: 3.5rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      font-size: 0.9rem;
    }

    /* Status bar */
    .status-bar {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .status-bar .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-bar .status .material-icons-round {
      font-size: 1.1rem;
    }

    /* ========== MODALS (Dashboard Style) ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: modalFadeIn 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalSlideUp {
      from { 
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to { 
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 620px;
      padding: 2.5rem 2.5rem 2.8rem;
      position: relative;
      animation: modalSlideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-height: 92vh;
      overflow-y: auto;
      color: var(--text-primary);
    }

    .modal-close {
      position: sticky;
      float: right;
      top: 0;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -0.5rem;
      margin-right: -0.5rem;
    }

    .modal-close:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #DC2626;
      border-color: rgba(239, 68, 68, 0.2);
      transform: rotate(90deg);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }

    .modal-header-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-bg);
      border: 1px solid rgba(101, 163, 13, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .modal-subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 1.8rem;
    }

    .modal-form-group {
      margin-bottom: 1.5rem;
    }

    .modal-form-group label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .modal-form-group label .material-icons-round {
      font-size: 1.1rem;
      color: var(--primary);
    }

    .modal-input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--bg-surface);
      transition: var(--transition);
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(101, 163, 13, 0.15);
    }

    .modal-input::placeholder {
      color: var(--text-muted);
    }

    .modal-textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.85rem 1.2rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: var(--font);
      color: var(--text-primary);
      background: var(--bg-surface);
      transition: var(--transition);
      resize: vertical;
    }

    .modal-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(101, 163, 13, 0.15);
    }

    .modal-textarea::placeholder {
      color: var(--text-muted);
    }

    .btn-modal-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-gradient);
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(101, 163, 13, 0.25);
      font-family: var(--font);
      margin-top: 0.5rem;
    }

    .btn-modal-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(101, 163, 13, 0.35);
    }

    .btn-modal-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-modal-submit.loading .btn-text {
      display: none;
    }
    .btn-modal-submit.loading .spinner {
      display: inline-block;
    }

    .spinner {
      display: none;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #FFFFFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Message Box */
    .message-box {
      margin-top: 1.2rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 500;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      border-left: 4px solid;
    }

    .message-box.error {
      display: flex;
      border-left-color: #DC2626;
      background: #FEF2F2;
      color: #991B1B;
    }

    .message-box.success {
      display: flex;
      border-left-color: var(--primary);
      background: #F7FEE7;
      color: var(--primary-dark);
    }

    .message-box .material-icons-round {
      font-size: 1.2rem;
    }

    .message-box.hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }
      .skill-container {
        padding: 1.5rem 1.25rem;
        border-radius: var(--radius-lg);
      }
      .skill-header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
      }
      .header-actions {
        width: 100%;
      }
      .btn-add-skill {
        width: 100%;
        justify-content: center;
      }
      .skill-grid {
        grid-template-columns: 1fr;
      }
      .modal-content {
        padding: 1.8rem 1.2rem;
        border-radius: var(--radius-lg);
      }
      .skill-card .skill-actions {
        flex-direction: column;
      }
      .skill-card .btn-skill-action {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="skill-container">
  <!-- Header -->
  <div class="skill-header">
    <div class="brand">
      <div class="brand-icon-wrapper">
        <span class="material-icons-round">bolt</span>
      </div>
      <h1>Skill Set</h1>
    </div>
    <div class="header-actions">
      <button class="btn-add-skill hidden" id="openAddModal">
        <span class="material-icons-round">add</span>
        Add Skill
      </button>
    </div>
  </div>

  <!-- Skill Content -->
  <div class="skill-content">
    <div id="skillGrid" class="skill-grid">
      <!-- Skills will be rendered here -->
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status">
      <span class="material-icons-round" id="statusIcon">info</span>
      <span id="statusText">Loading skills...</span>
    </div>
  </div>
</div>

<!-- ========== ADD/EDIT MODAL ========== -->
<div class="modal-overlay" id="skillModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <button class="modal-close" id="closeModal" aria-label="Close modal">
      <span class="material-icons-round">close</span>
    </button>

    <div class="modal-header">
      <div class="modal-header-icon">
        <span class="material-icons-round" id="modalHeaderIcon">add_circle</span>
      </div>
      <div>
        <h2 class="modal-title" id="modalTitle">Add Skill</h2>
        <p class="modal-subtitle" id="modalSubtitle">Add a new skill to your portfolio</p>
      </div>
    </div>

    <form id="skillForm" novalidate>
      <!-- Hidden field for skill_set_id (only for update) -->
      <input type="hidden" id="skillSetId" name="skill_set_id_" value="" />
      
      <div class="modal-form-group">
        <label for="skillTitleInput">
          <span class="material-icons-round">title</span>
          Skill Title
        </label>
        <input 
          type="text" 
          id="skillTitleInput" 
          name="skill_set_title"
          class="modal-input" 
          placeholder="e.g., Python, JavaScript, UI/UX Design"
          required
        />
      </div>

      <div class="modal-form-group">
        <label for="skillDescriptionInput">
          <span class="material-icons-round">description</span>
          Description
        </label>
        <textarea 
          id="skillDescriptionInput" 
          name="skill_set_description"
          class="modal-textarea" 
          placeholder="Describe your skill and proficiency level..."
          required
        ></textarea>
      </div>

      <button type="submit" class="btn-modal-submit" id="modalSubmitBtn">
        <span class="btn-text">Save Skill</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div id="modalMessage" class="message-box hidden">
      <span class="material-icons-round">info</span>
      <span id="modalMessageText"></span>
    </div>
  </div>
</div>

<script>
  (function() {
    // Get is_authenticated from template variable
    const isAuthenticated = {{ is_authenticated | tojson | safe }};
    
    // DOM Elements
    const skillGrid = document.getElementById('skillGrid');
    const statusText = document.getElementById('statusText');
    const statusIcon = document.getElementById('statusIcon');
    const openAddBtn = document.getElementById('openAddModal');

    // Modal Elements
    const modal = document.getElementById('skillModal');
    const closeModalBtn = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalHeaderIcon = document.getElementById('modalHeaderIcon');
    const skillForm = document.getElementById('skillForm');
    const skillTitleInput = document.getElementById('skillTitleInput');
    const skillDescriptionInput = document.getElementById('skillDescriptionInput');
    const skillSetIdInput = document.getElementById('skillSetId');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');
    const modalMessage = document.getElementById('modalMessage');
    const modalMessageText = document.getElementById('modalMessageText');

    // State
    let currentSkills = [];
    let isEditMode = false;
    let currentEditId = null;

    // ========== UPDATE BUTTON VISIBILITY ==========
    function updateButtonVisibility() {
      if (!isAuthenticated) {
        openAddBtn.classList.add('hidden');
      } else {
        openAddBtn.classList.remove('hidden');
      }
    }

    // ========== FETCH SKILLS ==========
    async function fetchSkills() {
      try {
        const response = await fetch('/skill-set/fetch', {
          method: 'GET',
        });

        const data = await response.json();

        if (data.success) {
          if (data.skill_set && data.skill_set.length > 0) {
            currentSkills = data.skill_set;
            renderSkills(currentSkills);
            statusText.textContent = `${currentSkills.length} skills found`;
            statusIcon.textContent = 'bolt';
            statusIcon.style.color = '#65A30D';
          } else {
            showEmptyState();
            statusText.textContent = 'No skills yet';
            statusIcon.textContent = 'bolt';
            statusIcon.style.color = '#94a3b8';
          }
        } else {
          showErrorState(data.message || 'Failed to fetch skills');
        }
      } catch (error) {
        console.error('Error fetching skills:', error);
        showErrorState('Network error. Please try again.');
      }
    }

    // ========== RENDER SKILLS ==========
    function renderSkills(skills) {
      if (!skills || skills.length === 0) {
        showEmptyState();
        return;
      }

      skillGrid.innerHTML = '';
      
      skills.forEach((skill) => {
        const card = document.createElement('div');
        card.className = 'skill-card';
        
        // Title
        const title = document.createElement('div');
        title.className = 'skill-title';
        title.innerHTML = `
          <span class="material-icons-round">code</span>
          ${skill.skill_set_title || 'Untitled Skill'}
        `;
        card.appendChild(title);
        
        // Description
        const desc = document.createElement('div');
        desc.className = 'skill-description';
        desc.textContent = skill.skill_set_description || 'No description provided';
        card.appendChild(desc);
        
        // Actions (only for authenticated users)
        const actions = document.createElement('div');
        actions.className = `skill-actions ${isAuthenticated ? '' : 'hidden'}`;
        
        // Edit button
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-skill-action btn-edit-skill';
        editBtn.innerHTML = `
          <span class="material-icons-round">edit</span>
          Edit
        `;
        editBtn.addEventListener('click', () => openEditModal(skill));
        actions.appendChild(editBtn);
        
        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-skill-action btn-delete-skill';
        deleteBtn.innerHTML = `
          <span class="material-icons-round">delete</span>
          Delete
        `;
        deleteBtn.addEventListener('click', () => deleteSkill(skill.skill_set_id));
        actions.appendChild(deleteBtn);
        
        card.appendChild(actions);
        skillGrid.appendChild(card);
      });
    }

    // ========== EMPTY STATE ==========
    function showEmptyState() {
      skillGrid.innerHTML = `
        <div class="empty-state">
          <span class="material-icons-round">bolt</span>
          <h3>No skills added yet</h3>
          <p>${isAuthenticated ? 'Click the "Add Skill" button to showcase your skills.' : 'Check back later to see the skills.'}</p>
        </div>
      `;
    }

    // ========== ERROR STATE ==========
    function showErrorState(message) {
      skillGrid.innerHTML = `
        <div class="empty-state">
          <span class="material-icons-round" style="color:#DC2626;">error</span>
          <h3 style="color:#DC2626;">Error</h3>
          <p>${message}</p>
        </div>
      `;
      statusText.textContent = 'Error loading skills';
      statusIcon.textContent = 'error';
      statusIcon.style.color = '#DC2626';
    }

    // ========== MODAL CONTROLS ==========
    function openModal(mode = 'add', data = null) {
      if (!isAuthenticated) {
        alert('You must be logged in to perform this action.');
        return;
      }

      isEditMode = mode === 'edit';
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      
      skillForm.reset();
      hideModalMessage();
      modalSubmitBtn.classList.remove('loading');
      modalSubmitBtn.disabled = false;

      if (isEditMode && data) {
        modalTitle.textContent = 'Edit Skill';
        modalSubtitle.textContent = 'Update your skill information';
        modalHeaderIcon.textContent = 'edit_note';
        skillTitleInput.value = data.skill_set_title || '';
        skillDescriptionInput.value = data.skill_set_description || '';
        skillSetIdInput.value = data.skill_set_id || '';
        currentEditId = data.skill_set_id;
      } else {
        modalTitle.textContent = 'Add Skill';
        modalSubtitle.textContent = 'Add a new skill to your portfolio';
        modalHeaderIcon.textContent = 'add_circle';
        skillSetIdInput.value = '';
        currentEditId = null;
      }

      setTimeout(() => skillTitleInput.focus(), 100);
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      hideModalMessage();
      modalSubmitBtn.classList.remove('loading');
      modalSubmitBtn.disabled = false;
      currentEditId = null;
    }

    function openAddModal() {
      if (!isAuthenticated) {
        alert('Please log in to add skills.');
        return;
      }
      openModal('add');
    }

    function openEditModal(skill) {
      if (!isAuthenticated) {
        alert('Please log in to edit skills.');
        return;
      }
      openModal('edit', skill);
    }

    // Modal event listeners
    openAddBtn.addEventListener('click', openAddModal);

    closeModalBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // ========== MODAL MESSAGES ==========
    function showModalMessage(text, type = 'error') {
      modalMessage.className = `message-box ${type}`;
      modalMessageText.textContent = text;
      modalMessage.style.display = 'flex';
    }

    function hideModalMessage() {
      modalMessage.className = 'message-box hidden';
      modalMessage.style.display = 'none';
    }

    function setModalLoading(loading) {
      if (loading) {
        modalSubmitBtn.classList.add('loading');
        modalSubmitBtn.disabled = true;
      } else {
        modalSubmitBtn.classList.remove('loading');
        modalSubmitBtn.disabled = false;
      }
    }

    // ========== HANDLE FORM SUBMISSION ==========
    skillForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideModalMessage();

      if (!isAuthenticated) {
        showModalMessage('You must be logged in to perform this action.', 'error');
        return;
      }

      const title = skillTitleInput.value.trim();
      const description = skillDescriptionInput.value.trim();
      
      if (!title) {
        showModalMessage('Please enter a skill title.', 'error');
        skillTitleInput.focus();
        return;
      }

      if (!description) {
        showModalMessage('Please enter a skill description.', 'error');
        skillDescriptionInput.focus();
        return;
      }

      const formData = new FormData();
      formData.append('skill_set_title', title);
      formData.append('skill_set_description', description);
      
      let endpoint;
      if (isEditMode && currentEditId) {
        endpoint = `/update-skill-set/${currentEditId}`;
      } else {
        endpoint = '/register-skill-set';
      }

      setModalLoading(true);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          body: formData,
        });

        let data;
        try {
          data = await response.json();
        } catch (_) {
          throw new Error('Server responded with invalid JSON.');
        }

        if (response.ok && data.success) {
          showModalMessage(data.message || 'Saved successfully!', 'success');
          
          setTimeout(() => {
            fetchSkills();
            closeModal();
          }, 800);
        } else {
          const errorMsg = data.message || 'An error occurred. Please try again.';
          showModalMessage(errorMsg, 'error');
        }
      } catch (error) {
        console.error('Form submission error:', error);
        showModalMessage('Network error. Please try again later.', 'error');
      } finally {
        setModalLoading(false);
      }
    });

    // ========== DELETE SKILL ==========
    async function deleteSkill(skillId) {
      if (!isAuthenticated) {
        alert('You must be logged in to delete skills.');
        return;
      }

      if (!skillId) {
        alert('No skill record to delete.');
        return;
      }

      if (!confirm('Are you sure you want to delete this skill? This action cannot be undone.')) {
        return;
      }

      try {
        const response = await fetch(`/delete-skill-set/${skillId}`, {
          method: 'GET',
        });

        let data;
        try {
          data = await response.json();
        } catch (_) {
          throw new Error('Server responded with invalid JSON.');
        }

        if (response.ok && data.success) {
          await fetchSkills();
          showTemporaryStatus('Skill deleted successfully', 'success');
        } else {
          const errorMsg = data.message || 'Failed to delete. Please try again.';
          alert(errorMsg);
        }
      } catch (error) {
        console.error('Delete error:', error);
        alert('Network error. Please try again later.');
      }
    }

    // ========== TEMPORARY STATUS ==========
    function showTemporaryStatus(message, type = 'success') {
      const originalText = statusText.textContent;
      const originalIcon = statusIcon.textContent;
      const originalColor = statusIcon.style.color;
      
      statusText.textContent = message;
      statusIcon.textContent = type === 'success' ? 'check_circle' : 'info';
      statusIcon.style.color = type === 'success' ? '#65A30D' : '#65A30D';
      
      setTimeout(() => {
        statusText.textContent = originalText;
        statusIcon.textContent = originalIcon;
        statusIcon.style.color = originalColor;
      }, 3000);
    }

    // ========== INIT ==========
    updateButtonVisibility();
    fetchSkills();

    console.log('Skill Set page ready. isAuthenticated:', isAuthenticated);
  })();
</script>

</body>
</html>
